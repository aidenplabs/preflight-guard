name: Firebase Experimental Validation

on:
  push:
    paths:
      - ".github/workflows/firebase-experimental-validation.yml"
      - "action.yml"
      - "src/**"
      - "fixtures/v7/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  public-firebase-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scanner repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Clone public Firebase sample
        run: git clone --depth 1 https://github.com/leerob/nextjs-vercel-firebase.git /tmp/firebase-public-sample

      - name: Run preflight on public Firebase sample
        uses: ./
        with:
          path: /tmp/firebase-public-sample
          output-dir: .preflight-firebase-public
          fail-on: never

      - name: Assert expected experimental result
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(".preflight-firebase-public/preflight-report.json", "utf8"));
          if (report.stack.profile !== "nextjs-firebase-vercel") {
            throw new Error(`Expected experimental Firebase profile, got ${report.stack.profile}`);
          }
          if (report.shipRecommendation !== "caution") {
            throw new Error(`Expected ship:caution for public experimental Firebase sample, got ${report.shipRecommendation}`);
          }
          NODE

      - name: Upload public Firebase reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-public-validation-reports
          path: |
            .preflight-firebase-public/preflight-report.json
            .preflight-firebase-public/preflight-report.md

  risky-firebase-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scanner repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Run preflight on risky Firebase fixture
        uses: ./
        with:
          path: fixtures/v7/firebase-unsafe
          output-dir: .preflight-firebase-unsafe
          fail-on: never

      - name: Assert blocker result
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(".preflight-firebase-unsafe/preflight-report.json", "utf8"));
          if (report.stack.profile !== "nextjs-firebase-vercel") {
            throw new Error(`Expected experimental Firebase profile, got ${report.stack.profile}`);
          }
          if (report.shipRecommendation !== "no") {
            throw new Error(`Expected ship:no for risky Firebase fixture, got ${report.shipRecommendation}`);
          }
          const ruleIds = new Set(report.findings.map((finding) => finding.ruleId));
          if (!ruleIds.has("FB001") || !ruleIds.has("FB002")) {
            throw new Error(`Expected FB001 and FB002 findings, got ${Array.from(ruleIds).join(", ")}`);
          }
          NODE

      - name: Upload risky Firebase reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-risky-validation-reports
          path: |
            .preflight-firebase-unsafe/preflight-report.json
            .preflight-firebase-unsafe/preflight-report.md
